name = "sandroleone-gaestebuch"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# "true": neue Einträge erscheinen erst nach Freigabe im Admin-Bereich
# "false": neue Einträge sind sofort sichtbar
MODERATION = "false"
ALLOWED_ORIGINS = "https://sandroleone.ch,https://www.sandroleone.ch,http://localhost:8000,http://localhost:8123"

[[d1_databases]]
binding = "DB"
database_name = "sandroleone-gaestebuch"
# Wird beim Deploy durch die GitHub Action mit der echten ID ersetzt
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
