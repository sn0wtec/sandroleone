name: Gästebuch-Worker deployen

on:
  push:
    branches: [main]
    paths: ['gaestebuch-worker/**', '.github/workflows/deploy-gaestebuch.yml']
  workflow_dispatch:

concurrency: deploy-gaestebuch

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gaestebuch-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: sandroleone-gaestebuch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit

      - name: D1-Datenbank anlegen (falls nötig) und ID eintragen
        run: |
          ID=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create "$DB_NAME"
            ID=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          test -n "$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Datenbank-Migrationen
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Worker deployen
        run: npx wrangler deploy

      - name: Admin-Passwort setzen
        env:
          ADMIN_PASSWORD: ${{ secrets.GB_ADMIN_PASSWORD }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then
            printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          else
            echo "::warning::Secret GB_ADMIN_PASSWORD fehlt – Admin-Bereich bleibt gesperrt."
          fi
